name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/dru1d3/dwea-ci:latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure pnpm store
        run: pnpm config set store-dir /workspace/.pnpm-store

      - uses: actions/cache@v4
        with:
          path: /workspace/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
